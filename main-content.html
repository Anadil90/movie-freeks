<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Movie Freeks</title>
</head>
<body>
    <!--bootstrap navbar-->
        <nav class="navbar navbar-expand-md bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="./main-content.html">
                    <i class="fa-solid fa-film"></i>
                    Movie Freeks
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        
                            <li class="nav-item">
                                <a class="nav-link" aria-current="page" href="./main-content.html">Home</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href=#>About</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href=#>Contact</a>
                            </li> 
                        
                            <li class="nav-item">
                                <a class="nav-link" href=#>Sign up</a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link" href=./login.html>Log in</a>
                            </li>  
                    </ul>
                </div>
            </div>
        </nav>
    <!--end of navbar-->
    
    <div class="container movie-search-container">
        <header id="searchbox"><!--the search header containing the search elements-->
            <div class="container">
                <h4 class="search-heading">Search for a movie and find out whether it's worth the watch.</h4>

                <div id="search-elements-container">
                    <form id="user-search">
                        <div class="form-elements-container">
                           <input type="text" id="search-text" name="searchInput" 
                            placeholder="Enter the movie you are looking for" required/>
                            <button type="submit" class="btn btn-info search-movie">Search Movie </button>    
                        </div> 
                    </form>
                </div>
            </div>
        </header>

        <div id="movie-search-result">
            <!--search results from api injected dynamically into corresponding elements with Javascript-->
            <div class="movie-info">
                <div id="movie-poster-container">
                    <img src="" alt="" class="movie-poster">
                </div>
               
                <div id="info-container">
                   <h5 id="movie-title" class="movie-info-elements"></h5>
                    <span class="movie-year movie-info-elements"></span>
                    <span class="movie-actors movie-info-elements"></span>
                    <span class="movie-director movie-info-elements"></span>
                    <p id="movie-plot" class="movie-info-elements"></p> 
                </div>
                
            </div>
        </div>

        <!--movie comments section-->
        <div class="movie-comments">
            <!--comments from users are displayed here-->
            <h6 class="comment-heading">Got something to say about this movie? Leave your comment</h6>
            <a href="./login.html" class="btn btn-primary btn-sm post-comment">Comment</a>

            <div class="comments-body"> <!--comment elements appended here dynamically--> ></div>
        </div>
    </div>

    
            
    <footer>
        <div id="footer-links-container"><!--footer links with icons representing links-->
            <a href="#" class="footer-links">Home <i class="fa-regular fa-house"></i></a>
            <a href="#" class="footer-links">About <i class="fa-solid fa-question"></i></a>
            <a href="#" class="footer-links">Contact <i class="fa-solid fa-phone"></i></a>
            <a href="#" class="footer-links">sign up <i class="fa-solid fa-clipboard"></i></i></a>
            <a href="./login.html" class="footer-links">Log in <i class="fa-solid fa-unlock"></i></a>     
        </div> 
    </footer>

    <!--jquery-->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <!--bootstrap script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>
    <!--font awesome script-->
    <script src="https://kit.fontawesome.com/9b1ff7d312.js" crossorigin="anonymous"></script>
   
    <!--main script-->
    <script src="./assets/javascript/script.js"></script>
</body>
</html>
