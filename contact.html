<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/contact.css">
    <title>Movie Freeks</title>
</head>

<body>

    <!--bootstrap navbar-->
    <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="./main-content.html">
                <i class="fa-solid fa-film"></i>
                Movie Freeks
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="./main-content.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./about.html">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="./contact.html">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./signup.html">Sign up</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="./login.html">Log in</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <!--end of navbar-->

    <section class="container mt-4">
        <h3 class="mb-3">Contact Movie Freeks</h3>
        <p>If you have questions, feedback, or suggestions, feel free to reach out using the form below.</p>

        <form id="contact-form" class="mt-4">

            <div id="contact-hint" class="mb-3"></div>

            <div class="mb-3">
                <label for="contact-name" class="form-label">Your Name</label>
                <input type="text" id="contact-name" name="contactName" class="form-control">
            </div>

            <div class="mb-3">
                <label for="contact-email" class="form-label">Your Email</label>
                <input type="email" id="contact-email" name="contactEmail" class="form-control">
            </div>

            <div class="mb-3">
                <label for="contact-message" class="form-label">Message</label>
                <textarea id="contact-message" name="contactMessage" class="form-control" rows="5"></textarea>
            </div>

            <button type="submit" class="btn btn-info">Send Message</button>
        </form>
    </section>

    <!--footer-->
    <footer class="mt-5">
        <div id="footer-links-container">
            <a href="./main-content.html" class="footer-links">Home <i class="fa-regular fa-house"></i></a>
            <a href="./about.html" class="footer-links">About <i class="fa-solid fa-question"></i></a>
            <a href="./contact.html" class="footer-links">Contact <i class="fa-solid fa-phone"></i></a>
            <a href="./signup.html" class="footer-links">Sign up <i class="fa-solid fa-clipboard"></i></a>
            <a href="./login.html" class="footer-links">Log in <i class="fa-solid fa-unlock"></i></a>
        </div>
    </footer>

    <!--jquery-->
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

    <!--bootstrap script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!--font awesome script-->
    <script src="https://kit.fontawesome.com/9b1ff7d312.js" crossorigin="anonymous"></script>

    <!--main script-->
    <script src="./assets/javascript/contact.js"></script>

</body>
</html>
