<head>

    <link rel="stylesheet" href="./assets/css/landing.css">

    <title>Movie Freeks</title>

<body>
    <div class="container" id="landing-content-container">
        <header>
            <h1 id="landing-title"><i class="fa-solid fa-film"></i> Movie Freeks</h1>
        </header>

        <div class="container cta-content">
            <!--call-to-action text-->
            <p id="call-to-action-text">

                Just like that! Click on the search movie button and let's find you that movie!
            </p>

            <button class="btn btn-primary call-to-action">Search Movie</button>
        </div>
    </div>

</body>
